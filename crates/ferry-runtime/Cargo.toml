[package]
name = "ferry-runtime"
version = "0.0.0"
description = "The engine both apps link. Composes ferry-core into one object with a callback, exposed through UniFFI."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "ferry_runtime"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[lints]
workspace = true

[dependencies]
ferry-core = { path = "../ferry-core" }
# Used only by `dav::random_hex`, for the per-start mount password and lock
# tokens. The same crate `ferry-core::session::SessionId` already uses, so
# this is not a new source of randomness in the workspace, only a direct
# dependency edge to reach the one this crate already trusts.
getrandom = "0.3"
thiserror = "2"
uniffi = { version = "0.32", features = ["cli"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
# Only for the recursive lister's unit tests, which walk MemoryFs so the two
# bounds in docs/engine-contract.md, batch D, item 2, can be proven without a
# network. See crates/ferry-runtime/src/folder.rs.
ferry-core = { path = "../ferry-core", features = ["testing"] }
