[package]
name = "ferry-core"
version = "0.0.0"
description = "Shared core for Ferry: file operations layer, transfer engine, and transports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Another project already owns this name on crates.io. This crate is
# never published there.
publish = false

[features]
# Exposes MemoryFs, the reference filesystem. It is a test double, so it stays
# out of the normal build and out of the published API surface.
testing = []

[lints]
workspace = true

[dependencies]
blake3 = "1.8"
cap-std = "4"
getrandom = "0.3"
mdns-sd = "0.21"
rustix = { version = "1", features = ["fs"] }
snow = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
proptest = "1"

