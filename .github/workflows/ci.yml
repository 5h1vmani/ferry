name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --all-features

      # A plain run catches a feature gate that hides a compile error.
      - name: Test without optional features
        run: cargo test --all

      # The apps are generated from the Rust surface, the design tokens, and
      # the error table. Each generator has a check mode, and these steps
      # fail when a committed generated file no longer matches its source.
      - name: Check the generated tokens and error words
        run: |
          python3 scripts/gen_tokens.py --check
          python3 scripts/gen_errors.py --check

      - name: Check the generated app bindings
        run: |
          scripts/gen_bindings.sh /tmp/bindings
          for f in ferry_runtime.swift ferry_runtimeFFI.h ferry_runtimeFFI.modulemap; do
            diff "/tmp/bindings/macos/Ferry/Generated/$f" "macos/Ferry/Generated/$f"
          done
          diff -r /tmp/bindings/android/app/src/main/kotlin/uniffi android/app/src/main/kotlin/uniffi

  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Ferry depends on snow, blake3, zeroize and getrandom for work that has
      # to be correct. A known advisory in any of them should fail the build.
      - name: Check advisories
        run: cargo audit --deny warnings
