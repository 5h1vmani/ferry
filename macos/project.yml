# XcodeGen project spec for Ferry on the Mac. This is the single source of
# truth for the Xcode project. Run `xcodegen generate` in this folder to
# produce Ferry.xcodeproj, which is not committed.
name: Ferry
options:
  bundleIdPrefix: app.ferry
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Ferry:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Ferry
        excludes:
          # The C header and the module map describe the Rust library to
          # Swift. They are read through OTHER_SWIFT_FLAGS below, so they
          # must not be compiled or copied into the app.
          - "Generated/ferry_runtimeFFI.h"
          - "Generated/ferry_runtimeFFI.modulemap"
    preBuildScripts:
      # Build the engine as a static library for this Mac before any Swift
      # is compiled. The script runs on every build, so a Rust change always
      # reaches the app. Cargo itself does nothing when nothing changed.
      #
      # The copy at the end matters. Cargo writes libferry_runtime.a and
      # libferry_runtime.dylib into one directory, and the linker takes the
      # dylib when both are on its search path. The copy stands alone in a
      # directory of its own, so -lferry_runtime can only find the static
      # library.
      - name: Build the Rust engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Xcode runs this script with a short PATH that has no cargo in it.
          # rustup writes this file for exactly that case.
          if [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          cd "$SRCROOT/.."
          export CARGO_TARGET_DIR="$SRCROOT/../target/xcode"
          # Xcode exports MACOSX_DEPLOYMENT_TARGET (14.0) into this script.
          # With Xcode 27 and rustc 1.92, that value also reaches the host
          # proc-macro dylibs, and dyld then refuses to load them ("can't
          # find crate for thiserror_impl"). Unset, rustc uses its own lower
          # default, and a library built for an older macOS links into a
          # 14.0 app without a warning.
          env -u MACOSX_DEPLOYMENT_TARGET \
            cargo build --release -p ferry-runtime --target aarch64-apple-darwin
          mkdir -p "$CARGO_TARGET_DIR/lib"
          cp -f "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/libferry_runtime.a" \
                "$CARGO_TARGET_DIR/lib/libferry_runtime.a"
    settings:
      base:
        PRODUCT_NAME: Ferry
        PRODUCT_BUNDLE_IDENTIFIER: app.ferry.mac
        # Signed with the owner's Apple team, a Personal Team. That gives the
        # app one identity across rebuilds, so the Keychain, the local
        # network prompt, and the firewall remember it. An ad hoc signature
        # changes with every build and each of the three asked again.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: L84QUBJX67
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Ferry/Ferry.entitlements
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        # Assets.xcassets/AppIcon holds every macOS icon size, rendered from
        # design_ouput/logo_assets/ferry-app-icon.svg. Without this setting
        # the catalog is built but no icon is picked from it.
        # docs/audits/oss-looks.md, B2.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # This Mac has an Apple silicon processor, and the engine is built
        # for that one target only.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        # Link the engine built by the script above. This directory holds
        # the static library and nothing else.
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../target/xcode/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lferry_runtime
        # Let Swift see the generated C header through its module map.
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(SRCROOT)/Ferry/Generated
        OTHER_SWIFT_FLAGS:
          - $(inherited)
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Ferry/Generated/ferry_runtimeFFI.modulemap
    info:
      path: Ferry/Info.plist
      properties:
        CFBundleName: Ferry
        CFBundleDisplayName: Ferry
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        # macOS 15 and later ask every app for local network access, whether
        # it is sandboxed or not. See docs/decisions/0010-no-mac-sandbox.md.
        NSLocalNetworkUsageDescription: Ferry finds your phone on this network and copies files from it.
        # macOS 14 and later answer no Wi-Fi network name until this app is
        # authorised for location. See docs/engine-contract.md, item 18.
        NSLocationUsageDescription: macOS treats the Wi-Fi network name as location data. Ferry reads the name to know which networks you trust.
        NSBonjourServices:
          - _ferry._tcp
        # A drop on the Dock icon pushes to the target device
        # (docs/ux-fix-plan.md, item 3). `LSHandlerRank: None` keeps Ferry
        # from ever becoming a default opener for `public.item`: this only
        # fires when a person drops files on the icon on purpose.
        CFBundleDocumentTypes:
          - CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.item
        # One Finder Services entry, "Send with Ferry". `NSMessage` names
        # the method `FerryServicesProvider` implements.
        # `docs/ux-fix-plan.md`, item 3.
        NSServices:
          - NSMenuItem:
              default: Send with Ferry
            NSMessage: sendWithFerry
            NSPortName: Ferry
            NSSendTypes:
              - public.file-url
